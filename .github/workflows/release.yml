name: Сборка и релиз

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Инструменты для сборки .rpm
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
      - name: Сборка (AppImage, deb, rpm, tar.gz)
        run: npx electron-builder --linux AppImage deb rpm tar.gz --publish never
      - name: Сохранить файлы как артефакт (для проверки)
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
      - name: Опубликовать релиз (только для тегов v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
